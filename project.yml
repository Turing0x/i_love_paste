name: Paste
options:
  bundleIdPrefix: dev.threedots.paste
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PasteCore:
    path: PasteCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    # El paquete usa concurrencia estricta; los targets de app también, para que
    # el capturador (hilo de fondo) y la interfaz no compartan estado por error.
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Firmar con equipo real y no ad-hoc: sin una identidad estable, macOS
    # considera que cada recompilación es otra app y vuelve a pedir el permiso
    # de Accesibilidad. Es además lo que exigen CloudKit y los App Groups.
    DEVELOPMENT_TEAM: "M2J9PP4RR8"
    CODE_SIGN_STYLE: Automatic

# Los schemes se declaran a mano y quedan compartidos en el proyecto. Sin esto
# los autocrea Xcode en el perfil del usuario, y el listado va y viene entre
# regeneraciones. Solo las dos apps: las extensiones se ejecutan a través de la
# app que las embebe, no por su cuenta.
schemes:
  PasteMac:
    build:
      targets:
        PasteMac: all
    run:
      config: Debug
    archive:
      config: Release

  PasteiOS:
    build:
      targets:
        PasteiOS: all
    run:
      config: Debug
    archive:
      config: Release


targets:
  PasteMac:
    type: application
    platform: macOS
    sources:
      - path: PasteMac
    dependencies:
      - package: PasteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.threedots.paste.mac
        INFOPLIST_FILE: PasteMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PasteMac/PasteMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Sin sandbox a propósito: con él no hay permiso de Accesibilidad, ni
        # detección de la app en primer plano, ni Direct Paste. Renuncia
        # deliberada a distribuir por la Mac App Store.
        ENABLE_APP_SANDBOX: NO

  PasteiOS:
    type: application
    platform: iOS
    sources:
      - path: PasteiOS
    dependencies:
      - package: PasteCore
      # Embebidas en la app: se instalan y se firman con ella.
      - target: PasteShareExtension
      - target: PasteWidget
      - target: PasteKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.threedots.paste.ios
        INFOPLIST_FILE: PasteiOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PasteiOS/PasteiOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  PasteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PasteWidget
    dependencies:
      - package: PasteCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.threedots.paste.ios.widget
        INFOPLIST_FILE: PasteWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PasteWidget/PasteWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  PasteKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: PasteKeyboard
    dependencies:
      - package: PasteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.threedots.paste.ios.keyboard
        INFOPLIST_FILE: PasteKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: PasteKeyboard/PasteKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  PasteShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PasteShareExtension
    dependencies:
      - package: PasteCore
    settings:
      base:
        # El identificador cuelga del de la app: si no, el sistema no la
        # reconoce como su extensión.
        PRODUCT_BUNDLE_IDENTIFIER: dev.threedots.paste.ios.share
        INFOPLIST_FILE: PasteShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PasteShareExtension/PasteShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
